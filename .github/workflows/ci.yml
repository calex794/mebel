name: Проверка сайта
on:
  push:
  pull_request:
jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
        env:
          DEBUG: '1'
      - run: python manage.py makemigrations --check --dry-run
        env:
          DEBUG: '1'
      - run: python manage.py collectstatic --noinput
        env:
          DEBUG: '1'
      - run: python manage.py test
        env:
          DEBUG: '1'
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/prepare_preview.py
      - run: docker compose -f compose.preview.yaml config --quiet
      - run: docker compose -f compose.preview.yaml up -d --build --wait
      - run: python scripts/smoke_preview.py
      - if: always()
        run: docker compose -f compose.preview.yaml down -v || true
  production-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/prepare_production.py example.org admin@example.org
      - run: docker compose --env-file .env.production -f compose.production.yaml config --quiet
      - run: docker run --rm -e SITE_DOMAIN=example.org -e ACME_EMAIL=admin@example.org -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - run: docker compose --env-file .env.production -f compose.production.yaml up -d --build --wait db cache web
      - run: docker compose --env-file .env.production -f compose.production.yaml exec -T web python manage.py migrate --noinput
      - run: docker compose --env-file .env.production -f compose.production.yaml exec -T web python manage.py check --deploy
      - run: mkdir -p /tmp/mebel-ci-backups && sh scripts/backup_production.sh /tmp/mebel-ci-backups && sh scripts/check_backup.sh /tmp/mebel-ci-backups/*.tar.gz
      - run: |
          mkdir -p /tmp/mebel-ci-restore
          tar -xzf /tmp/mebel-ci-backups/*.tar.gz -C /tmp/mebel-ci-restore
          docker compose --env-file .env.production -f compose.production.yaml exec -T db createdb -U mebel mebel_restore_ci
          docker compose --env-file .env.production -f compose.production.yaml exec -T db pg_restore -U mebel -d mebel_restore_ci --no-owner --no-privileges < /tmp/mebel-ci-restore/database.dump
          docker compose --env-file .env.production -f compose.production.yaml exec -T db psql -U mebel -d mebel_restore_ci -tAc "SELECT count(*) FROM django_migrations" | grep -Eq '^[1-9][0-9]*

      - if: always()
        run: docker compose --env-file .env.production -f compose.production.yaml down -v || true
