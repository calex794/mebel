<div class="cards">{% for item in items %}<article class="card"><a href="{{ item.get_absolute_url }}" class="card-photo">{% if item.image %}<img loading="lazy" src="{{ item.image.url }}" alt="{{ item.title }}">{% else %}<span class="photo-placeholder">Фотография появится здесь</span>{% endif %}</a><div class="card-body"><h3><a href="{{ item.get_absolute_url }}">{{ item.title }}</a></h3>{% if item.summary %}<p>{{ item.summary|truncatechars:155 }}</p>{% endif %}<a href="{{ item.get_absolute_url }}" class="text-link">Подробнее →</a></div></article>{% empty %}<p class="empty">{{ empty_text|default:"Материалы пока не опубликованы." }}</p>{% endfor %}</div>
